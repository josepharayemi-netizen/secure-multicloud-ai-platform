apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secure-ai-api
  namespace: secure-ai
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: secure-ai-api}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
